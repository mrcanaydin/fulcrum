services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:z
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fulcrum
      DB_USERNAME: fulcrum
      DB_PASSWORD: secret
      STORAGE_DISK: local
      STORAGE_LOCAL_ROOT: /var/www/html/storage/app
      CACHE_STORE: redis
      CACHE_FILE_PATH: /var/www/html/storage/cache
      QUEUE_CONNECTION: database
      QUEUE_JOBS_TABLE: jobs
      QUEUE_NAME: default
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_DB: 0
      REDIS_CACHE_PREFIX: "fulcrum:"
      LOG_CHANNEL: file
      LOG_FILE_PATH: /var/www/html/storage/logs/fulcrum.log
      MAIL_MAILER: log
      MAIL_LOG_PATH: /var/www/html/storage/logs/mail.log
      NOTIFICATION_CHANNEL: log
      NOTIFICATION_LOG_PATH: /var/www/html/storage/logs/notifications.log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7.4-alpine
    ports:
      - "63790:6379"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fulcrum
      POSTGRES_USER: fulcrum
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulcrum -d fulcrum"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "54320:5432"
