services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:z
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fulcrum
      DB_USERNAME: fulcrum
      DB_PASSWORD: secret
      STORAGE_DISK: local
      STORAGE_LOCAL_ROOT: /var/www/html/storage/app
      CACHE_STORE: file
      CACHE_FILE_PATH: /var/www/html/storage/cache
      LOG_CHANNEL: file
      LOG_FILE_PATH: /var/www/html/storage/logs/fulcrum.log
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fulcrum
      MYSQL_USER: fulcrum
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3307:3306"
