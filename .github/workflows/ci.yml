name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fulcrum_ci
          POSTGRES_USER: fulcrum
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fulcrum -d fulcrum_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fulcrum_ci
          MYSQL_USER: fulcrum
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        working-directory: core
        run: composer install --no-interaction --prefer-dist

      - name: Verify PHPUnit
        working-directory: core
        run: ./vendor/bin/phpunit --version

      - name: Run Pest
        working-directory: core
        env:
          FULCRUM_TEST_PGSQL: "1"
          FULCRUM_PGSQL_HOST: 127.0.0.1
          FULCRUM_PGSQL_PORT: 5432
          FULCRUM_PGSQL_DATABASE: fulcrum_ci
          FULCRUM_PGSQL_USERNAME: fulcrum
          FULCRUM_PGSQL_PASSWORD: secret
          FULCRUM_TEST_MYSQL: "1"
          FULCRUM_MYSQL_HOST: 127.0.0.1
          FULCRUM_MYSQL_PORT: 3306
          FULCRUM_MYSQL_DATABASE: fulcrum_ci
          FULCRUM_MYSQL_USERNAME: fulcrum
          FULCRUM_MYSQL_PASSWORD: secret
          FULCRUM_TEST_REDIS: "1"
          FULCRUM_REDIS_HOST: 127.0.0.1
          FULCRUM_REDIS_PORT: 6379
          FULCRUM_TEST_MIGRATIONS: "1"
        run: ./vendor/bin/pest --colors=never

      - name: Run PHPStan
        working-directory: core
        run: php -d memory_limit=-1 ./vendor/bin/phpstan analyse src/Fulcrum/Auth/Migrations src/Fulcrum/Cache src/Fulcrum/Console src/Fulcrum/Database/Migrations src/Fulcrum/Events src/Fulcrum/Logging src/Fulcrum/Queue/Migrations src/Fulcrum/Storage src/Fulcrum/Validation src/Fulcrum/Routing src/Fulcrum/Foundation/Application.php src/Fulcrum/Foundation/Exceptions/Handler.php src/Fulcrum/GraphQL/Executor.php --no-progress

  skeleton-smoke:
    name: Skeleton Docker smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          coverage: none

      - name: Run smoke test
        working-directory: skeleton
        run: ./scripts/smoke.sh

      - name: Stop smoke stack
        if: always()
        working-directory: skeleton
        run: docker compose down -v --remove-orphans
