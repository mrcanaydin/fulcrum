name: Skeleton Docker Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: skeleton-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect skeleton changes
    runs-on: ubuntu-latest
    outputs:
      skeleton: ${{ steps.filter.outputs.skeleton }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            skeleton:
              - 'skeleton/**'
              - '.github/workflows/skeleton-smoke.yml'

  smoke:
    name: Skeleton Docker smoke
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.skeleton == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-skeleton-${{ runner.os }}-${{ hashFiles('core/composer.lock', 'skeleton/composer.json') }}
          restore-keys: |
            composer-skeleton-${{ runner.os }}-

      - name: Run smoke test
        working-directory: skeleton
        run: ./scripts/smoke.sh
